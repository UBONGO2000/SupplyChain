name: Security

# Runs on every push to main and once a week, independently of CI/CD --
# a red run here surfaces something to triage, it does not block deploys
# (only the CI workflow gates the CD workflow).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    name: Bandit (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit==1.9.4

      - name: Run bandit
        run: bandit -r . -x ./tests,./alembic/versions

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit dependencies
        # PYSEC-2026-1325 (ecdsa): no fix published -- a timing side-channel
        # in the pure-Python implementation the maintainers have stated they
        # won't patch. Transitive dep of python-jose, used only for
        # ECDSA-based JWT algorithms; this project signs tokens with HS256
        # (see ALGORITHM in config.py), so the vulnerable path never runs.
        run: pip-audit -r requirements.txt -r dev-requirements.txt --ignore-vuln PYSEC-2026-1325
