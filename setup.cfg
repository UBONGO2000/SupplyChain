[flake8]
max-line-length = 100
# E203/W503: black formats slices/operators in a way flake8's defaults
# disagree with -- this is the standard black+flake8 compatibility ignore.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    alembic/versions
per-file-ignores =
    # Env vars must be set (and the project root added to sys.path) before
    # importing anything config-dependent -- imports are intentionally not
    # at the top of the file here.
    tests/conftest.py: E402
